<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Recovery System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }
    .container {
      max-width: 950px;
      margin: auto;
    }
    h1 { color: #172b4d; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000a;
    }
    .number {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }
    form {
      display: grid;
      gap: 12px;
      margin-top: 15px;
    }
    input, select, button {
      padding: 13px;
      border: 1px solid #dce1eb;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      background: #2457e6;
      color: white;
      border: 0;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }
    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    @media(max-width: 600px) {
      body { padding: 12px; }
      .stats { grid-template-columns: 1fr; }
      .table-wrap { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lead Recovery System</h1>
    <p>Manage customer inquiries and never miss a sales opportunity.</p>

    <div class="stats">
      <div class="card">Total Leads
        <div class="number" id="total">0</div>
      </div>
      <div class="card">Follow-ups Pending
        <div class="number" id="pending">0</div>
      </div>
      <div class="card">Converted
        <div class="number" id="converted">0</div>
      </div>
    </div>

    <div class="card">
      <h2>Add New Lead</h2>
      <form id="leadForm">
        <input id="name" placeholder="Customer name" required>
        <input id="phone" placeholder="Phone number" required>
        <input id="service" placeholder="Interested service" required>
        <select id="status">
          <option value="Pending">Pending</option>
          <option value="Contacted">Contacted</option>
          <option value="Converted">Converted</option>
        </select>
        <button type="submit">Add Lead</button>
      </form>
    </div>

    <div class="card" style="margin-top:20px">
      <h2>Customer Leads</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Service</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="leadList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem("leads") || "[]");

    const form = document.getElementById("leadForm");

    function render() {
      document.getElementById("total").textContent = leads.length;
      document.getElementById("pending").textContent =
        leads.filter(l => l.status === "Pending").length;
      document.getElementById("converted").textContent =
        leads.filter(l => l.status === "Converted").length;

      document.getElementById("leadList").innerHTML = leads.map(l =>
        `<tr>
          <td>${escapeHTML(l.name)}</td>
          <td>${escapeHTML(l.phone)}</td>
          <td>${escapeHTML(l.service)}</td>
          <td>${escapeHTML(l.status)}</td>
        </tr>`
      ).join("");

      localStorage.setItem("leads", JSON.stringify(leads));
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      leads.push({
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        service: document.getElementById("service").value.trim(),
        status: document.getElementById("status").value
      });

      form.reset();
      render();
    });

    render();
  </script>
</body>
</html>
