<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Recovery System</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #172033;
}

.container { max-width: 1100px; margin: auto; }

h1 { color: #172b4d; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 25px 0;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #0000000a;
  margin-bottom: 20px;
}

.number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 10px;
}

form { display: grid; gap: 12px; }

input, select, button {
  padding: 12px;
  border: 1px solid #dce1eb;
  border-radius: 7px;
  font-size: 14px;
}

button {
  background: #2457e6;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover { opacity: .85; }

.cancel { background: #64748b; }

.delete { background: #dc3545; }

.edit { background: #e99a18; }

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  min-width: 650px;
}

th, td {
  padding: 13px;
  text-align: left;
  border-bottom: 1px solid #eee;
}

th { background: #f7f8fc; }

.actions { display: flex; gap: 6px; }

.actions button { padding: 8px; }

@media(max-width:600px) {
  body { padding: 12px; }
  .stats { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="container">

<h1>Lead Recovery System</h1>
<p>Manage customers, track leads and recover missed sales.</p>

<div class="stats">
  <div class="card">
    Total Leads
    <div class="number" id="total">0</div>
  </div>

  <div class="card">
    Follow-ups Pending
    <div class="number" id="pending">0</div>
  </div>

  <div class="card">
    Converted
    <div class="number" id="converted">0</div>
  </div>
</div>

<div class="card">
  <h2 id="formTitle">Add New Lead</h2>

  <form id="leadForm">
    <input id="name" placeholder="Customer name" required>
    <input id="phone" placeholder="Phone number" required>
    <input id="service" placeholder="Interested service" required>

    <select id="status">
      <option value="Pending">Pending</option>
      <option value="Contacted">Contacted</option>
      <option value="Converted">Converted</option>
    </select>

    <label>Follow-up date</label>
    <input type="date" id="followup">

    <button type="submit" id="saveButton">Add Lead</button>
    <button type="button" class="cancel" id="cancelButton" hidden>
      Cancel Editing
    </button>
  </form>
</div>

<div class="card">
  <h2>Customer Leads</h2>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Service</th>
          <th>Status</th>
          <th>Follow-up</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="leadList"></tbody>
    </table>
  </div>
  <p id="emptyMessage">No leads added yet.</p>
</div>

</div>

<script>
let leads = JSON.parse(localStorage.getItem("leads") || "[]");
let editingId = null;

const form = document.getElementById("leadForm");

function saveData() {
  localStorage.setItem("leads", JSON.stringify(leads));
}

function createCell(value) {
  const td = document.createElement("td");
  td.textContent = value || "-";
  return td;
}

function render() {
  document.getElementById("total").textContent = leads.length;

  document.getElementById("pending").textContent =
    leads.filter(l => l.status === "Pending").length;

  document.getElementById("converted").textContent =
    leads.filter(l => l.status === "Converted").length;

  const tbody = document.getElementById("leadList");
  tbody.replaceChildren();

  document.getElementById("emptyMessage").hidden = leads.length > 0;

  leads.forEach(lead => {
    const tr = document.createElement("tr");

    tr.appendChild(createCell(lead.name));
    tr.appendChild(createCell(lead.phone));
    tr.appendChild(createCell(lead.service));

    const statusCell = document.createElement("td");
    const statusSelect = document.createElement("select");

    ["Pending", "Contacted", "Converted"].forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = lead.status;
    statusSelect.addEventListener("change", () => {
      lead.status = statusSelect.value;
      saveData();
      render();
    });

    statusCell.appendChild(statusSelect);
    tr.appendChild(statusCell);

    tr.appendChild(createCell(lead.followup));

    const actionCell = document.createElement("td");
    const actions = document.createElement("div");
    actions.className = "actions";

    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.className = "edit";
    editButton.addEventListener("click", () => editLead(lead.id));

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "delete";
    deleteButton.addEventListener("click", () => deleteLead(lead.id));

    actions.append(editButton, deleteButton);
    actionCell.appendChild(actions);
    tr.appendChild(actionCell);

    tbody.appendChild(tr);
  });
}

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    service: document.getElementById("service").value.trim(),
    status: document.getElementById("status").value,
    followup: document.getElementById("followup").value
  };

  if (editingId !== null) {
    const index = leads.findIndex(l => l.id === editingId);
    if (index !== -1) leads[index] = { ...leads[index], ...data };
  } else {
    leads.push({
      id: Date.now().toString() + Math.random().toString(36).slice(2),
      ...data
    });
  }

  saveData();
  form.reset();
  editingId = null;
  resetForm();
  render();
});

function editLead(id) {
  const lead = leads.find(l => l.id === id);
  if (!lead) return;

  editingId = id;

  document.getElementById("name").value = lead.name;
  document.getElementById("phone").value = lead.phone;
  document.getElementById("service").value = lead.service;
  document.getElementById("status").value = lead.status;
  document.getElementById("followup").value = lead.followup || "";

  document.getElementById("formTitle").textContent = "Edit Lead";
  document.getElementById("saveButton").textContent = "Update Lead";
  document.getElementById("cancelButton").hidden = false;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteLead(id) {
  if (!confirm("Are you sure you want to delete this lead?")) return;

  leads = leads.filter(l => l.id !== id);

  if (editingId === id) {
    form.reset();
    editingId = null;
    resetForm();
  }

  saveData();
  render();
}

function resetForm() {
  document.getElementById("formTitle").textContent = "Add New Lead";
  document.getElementById("saveButton").textContent = "Add Lead";
  document.getElementById("cancelButton").hidden = true;
}

document.getElementById("cancelButton").addEventListener("click", () => {
  form.reset();
  editingId = null;
  resetForm();
});

render();
</script>
</body>
</html>
